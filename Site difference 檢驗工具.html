<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site difference 檢驗工具</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#17212b;--mute:#667385;--line:#d9dfe6;--acc:#0b6bcb;--bad:#c2410c;--badbg:#ffedd5;--warn:#a16207;--warnbg:#fef3c7;--ok:#2f7d4f;--box:#9db8d6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151c;--panel:#18212b;--ink:#e6ebf1;--mute:#93a1b2;--line:#2b3846;--acc:#5aa9f5;--bad:#fb923c;--badbg:#3b2312;--warn:#facc15;--warnbg:#33290c;--ok:#5fc08a;--box:#35597f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f151c;--panel:#18212b;--ink:#e6ebf1;--mute:#93a1b2;--line:#2b3846;--acc:#5aa9f5;--bad:#fb923c;--badbg:#3b2312;--warn:#facc15;--warnbg:#33290c;--ok:#5fc08a;--box:#35597f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Noto Sans TC","PingFang TC",system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
#drop{border:2px dashed var(--line);border-radius:6px;padding:22px;text-align:center;color:var(--mute);cursor:pointer}
#drop.on{border-color:var(--acc);color:var(--acc)}
.ctl{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center}
.ctl label{display:flex;gap:6px;align-items:center}
input[type=number],select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px;width:76px}
select{width:auto}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{cursor:pointer;color:var(--mute);font-weight:600;user-select:none}
th.s{color:var(--acc)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
tr.sel{outline:2px solid var(--acc);outline-offset:-2px}
.f{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px}
.f.hi{background:var(--badbg);color:var(--bad)}.f.mid{background:var(--warnbg);color:var(--warn)}.f.ok{color:var(--ok)}
#msg{color:var(--mute);margin:8px 0 0}
#detail h2{font-size:16px;margin:0 0 8px}
svg{max-width:100%;height:auto;display:block}
svg text{fill:var(--mute);font-size:11px}
.note{color:var(--mute);font-size:12px;margin-top:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Site difference 檢驗工具</h1>
<p class="sub">載入 wafer 測試 CSV（可直接放 .zip，含巢狀 zip），快速找出各測項中 site 間差異過大的項目。資料只在瀏覽器內處理，不會上傳。</p>

<div class="panel">
 <div id="drop" tabindex="0" role="button">把 .csv / .zip 拖到這裡，或點擊選檔</div>
 <input id="file" type="file" multiple accept=".csv,.zip" hidden>
 <p id="msg"></p>
</div>

<div class="panel ctl" id="ctl" hidden>
 <label>Lot <select id="lot"></select></label>
 <label><input type="checkbox" id="b1"> 只算 Bin1 good die</label>
 <label>Δ/σ 門檻 <input type="number" id="t1" value="0.5" step="0.1" min="0"></label>
 <label>Δ/Spec 門檻 % <input type="number" id="t2" value="5" step="1" min="0"></label>
 <label><input type="checkbox" id="only"> 只顯示超標項目</label>
</div>

<div class="panel" id="res" hidden>
 <div class="tw"><table id="tb"><thead></thead><tbody></tbody></table></div>
 <p class="note">Δ = 各 site 中位數的最大值減最小值；σ = site 內合併標準差；Δ/Spec = Δ 除以 (上限 − 下限)；η² = site 造成的變異佔總變異比例。點選任一列看各 site 的 box plot。</p>
</div>

<div class="panel" id="detail" hidden></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let D=null, rows=[], sortKey='score', sortDir=-1, selTest=null;

/* ---------- parsing ---------- */
function splitLine(l){
  if(l.indexOf('"')<0) return l.split(',');
  const o=[];let c='',q=false;
  for(let i=0;i<l.length;i++){const ch=l[i];
    if(ch==='"'){ if(q&&l[i+1]==='"'){c+='"';i++} else q=!q }
    else if(ch===','&&!q){o.push(c);c=''} else c+=ch }
  o.push(c);return o;
}
const num=s=>{if(s==null||s==='')return NaN;const v=+s;return isFinite(v)?v:NaN};
function parseCSV(text,store){
  const L=text.split(/\r?\n/);
  let hi=-1;
  for(let i=0;i<L.length&&i<80;i++){ if(/^"?Serial#/.test(L[i])){hi=i;break} }
  if(hi<0) return false;
  let ni=-1;
  for(let i=0;i<hi;i++){ const c=splitLine(L[i]); if(c.length>8 && /Test Time/i.test(c[6]||'')){ni=i;break} }
  if(ni<0) return false;
  const names=splitLine(L[ni]).map(s=>s.trim());
  const units=splitLine(L[ni+1]||'');
  const hiL=splitLine(L[ni+3]||''), loL=splitLine(L[ni+4]||'');
  const w=(L.slice(0,30).join('\n').match(/Wafer ID\s*:?\s*([^\s,"]+)/i)||[])[1]||('wafer'+store.nw);
  const lot=w.split('-')[0];
  store.nw++;
  for(let i=6;i<names.length;i++){
    if(!names[i]) continue;
    let t=store.tests.find(x=>x.name===names[i]);
    if(!t){t={name:names[i],unit:(units[i]||'').trim(),hi:num(hiL[i]),lo:num(loL[i]),vals:[]};store.tests.push(t)}
    t.idx=t.idx||{};t.idx[w]=i;
  }
  const start=store.site.length;
  const cols=[];
  for(let r=hi+1;r<L.length;r++){
    const l=L[r]; if(!l||l.charCodeAt(0)<48||l.charCodeAt(0)>57) continue;
    const c=splitLine(l);
    store.site.push(+c[1]);store.bin.push(+c[2]);store.lot.push(lot);store.wafer.push(w);
    cols.push(c);
  }
  for(const t of store.tests){
    const i=t.idx&&t.idx[w];
    while(t.vals.length<start) t.vals.push(NaN);
    for(const c of cols) t.vals.push(i==null?NaN:num(c[i]));
  }
  return true;
}
async function readEntry(name,getBuf,store){
  if(/\.zip$/i.test(name)){
    const z=await JSZip.loadAsync(await getBuf());
    for(const n of Object.keys(z.files)){ const f=z.files[n]; if(!f.dir && !/__MACOSX/.test(n)) await readEntry(n,()=>f.async('arraybuffer'),store) }
  } else if(/\.csv$/i.test(name)){
    const ok=parseCSV(new TextDecoder('windows-1252').decode(await getBuf()),store);
    if(ok) store.files++; else store.skipped.push(name);
  }
}
async function load(files){
  $('msg').textContent='解析中…';
  const store={tests:[],site:[],bin:[],lot:[],wafer:[],nw:0,files:0,skipped:[]};
  try{
    for(const f of files) await readEntry(f.name,()=>f.arrayBuffer(),store);
  }catch(e){ $('msg').textContent='讀檔失敗：'+e.message; return }
  if(!store.files){ $('msg').textContent='找不到可辨識的測試 CSV（需含 Serial# 標題列與 Test Time 欄）。'; return }
  for(const t of store.tests) while(t.vals.length<store.site.length) t.vals.push(NaN);
  D=store;
  const lots=[...new Set(D.lot)].sort();
  $('lot').innerHTML='<option value="">全部 ('+lots.length+' lots)</option>'+lots.map(x=>`<option>${x}</option>`).join('');
  $('msg').textContent=`已載入 ${D.files} 個檔案、${D.nw} 片 wafer、${D.site.length.toLocaleString()} 顆 die、${D.tests.length} 個測項`+(D.skipped.length?`；略過 ${D.skipped.length} 個無法辨識的檔案`:'');
  ['ctl','res'].forEach(i=>$(i).hidden=false);
  analyze();
}

/* ---------- stats ---------- */
function q(a,p){const i=(a.length-1)*p,f=Math.floor(i),c=Math.ceil(i);return a[f]+(a[c]-a[f])*(i-f)}
function siteStats(t,mask){
  const g={};
  for(let i=0;i<t.vals.length;i++){ const v=t.vals[i]; if(v!==v||!mask(i)) continue; (g[D.site[i]]=g[D.site[i]]||[]).push(v) }
  const out=[];
  for(const s of Object.keys(g).map(Number).sort((a,b)=>a-b)){
    const a=g[s].sort((x,y)=>x-y), n=a.length, m=a.reduce((x,y)=>x+y,0)/n;
    const sd=n>1?Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(n-1)):0;
    const med=q(a,.5),q1=q(a,.25),q3=q(a,.75),iqr=q3-q1;
    const wl=a.find(v=>v>=q1-1.5*iqr),wh=[...a].reverse().find(v=>v<=q3+1.5*iqr);
    let f=0; if(t.lo===t.lo||t.hi===t.hi) for(const v of a) if((t.lo===t.lo&&v<t.lo)||(t.hi===t.hi&&v>t.hi)) f++;
    out.push({site:s,n,mean:m,sd,med,q1,q3,wl,wh,f});
  }
  return out;
}
function analyze(){
  const lot=$('lot').value, b1=$('b1').checked;
  const mask=i=>(!lot||D.lot[i]===lot)&&(!b1||D.bin[i]===1);
  rows=[];
  for(const t of D.tests){
    const st=siteStats(t,mask).filter(s=>s.n>=5);
    if(st.length<2) continue;
    const N=st.reduce((x,s)=>x+s.n,0);
    const meds=st.map(s=>s.med), delta=Math.max(...meds)-Math.min(...meds);
    const dof=N-st.length, sp=dof>0?Math.sqrt(st.reduce((x,s)=>x+(s.n-1)*s.sd*s.sd,0)/dof):0;
    const gm=st.reduce((x,s)=>x+s.mean*s.n,0)/N;
    const ssb=st.reduce((x,s)=>x+s.n*(s.mean-gm)**2,0), ssw=st.reduce((x,s)=>x+(s.n-1)*s.sd*s.sd,0);
    const spec=(t.hi===t.hi&&t.lo===t.lo&&t.hi>t.lo)?t.hi-t.lo:NaN;
    const score=sp>0?delta/sp:(delta>0?999:0);
    const mean=meds.reduce((x,y)=>x+y,0)/meds.length;
    let worst=st[0]; for(const s of st) if(Math.abs(s.med-mean)>Math.abs(worst.med-mean)) worst=s;
    rows.push({t,st,N,delta,sp,score,specPct:spec===spec?delta/spec*100:NaN,eta:ssb+ssw>0?ssb/(ssb+ssw):0,worst:worst.site,off:worst.med-mean});
  }
  render();
}

/* ---------- table ---------- */
const COLS=[['name','測項','l'],['N','N'],['worst','偏離最大 site'],['off','該 site 偏移'],['delta','Δ'],['sp','σ(site 內)'],['score','Δ/σ'],['specPct','Δ/Spec %'],['eta','η²'],['flag','判定']];
const fmt=v=>v!==v?'–':(v===0?'0':Math.abs(v)>=1000||Math.abs(v)<0.001?v.toExponential(2):(+v.toPrecision(4)).toString());
function level(r){
  const a=+$('t1').value,b=+$('t2').value;
  const x=r.score>=a*2||(r.specPct===r.specPct&&r.specPct>=b*2), y=r.score>=a||(r.specPct===r.specPct&&r.specPct>=b);
  return x?2:(y?1:0);
}
function render(){
  const th=$('tb').tHead; th.innerHTML='<tr>'+COLS.map(c=>`<th class="${c[2]||''} ${sortKey===c[0]?'s':''}" data-k="${c[0]}">${c[1]}${sortKey===c[0]?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
  rows.forEach(r=>{r.name=r.t.name;r.flag=level(r)});
  let v=rows.filter(r=>!$('only').checked||r.flag>0);
  v.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];const nx=x!==x,ny=y!==y;if(nx||ny)return nx-ny;return (typeof x==='string'?x.localeCompare(y):x-y)*sortDir});
  $('tb').tBodies[0].innerHTML=v.map(r=>`<tr data-n="${r.name.replace(/"/g,'&quot;')}" class="${selTest===r.name?'sel':''}"><td class="l">${r.name}${r.t.unit?` <span style="color:var(--mute)">(${r.t.unit})</span>`:''}</td><td>${r.N}</td><td>Site ${r.worst}</td><td>${(r.off>0?'+':'')+fmt(r.off)}</td><td>${fmt(r.delta)}</td><td>${fmt(r.sp)}</td><td>${r.score>=999?'∞':r.score.toFixed(2)}</td><td>${r.specPct===r.specPct?r.specPct.toFixed(1):'–'}</td><td>${r.eta.toFixed(3)}</td><td><span class="f ${['ok','mid','hi'][r.flag]}">${['正常','注意','過大'][r.flag]}</span></td></tr>`).join('')||'<tr><td class="l" colspan="10">沒有符合條件的測項</td></tr>';
  const n=rows.filter(r=>r.flag>0).length; $('res').querySelector('.note').dataset.n=n;
  if(selTest) detail(selTest);
}

/* ---------- detail box plot ---------- */
function detail(name){
  selTest=name;
  const r=rows.find(x=>x.t.name===name); if(!r){$('detail').hidden=true;return}
  const t=r.t, st=r.st;
  let lo=Math.min(...st.map(s=>s.wl)), hi=Math.max(...st.map(s=>s.wh));
  const span=(hi-lo)||Math.abs(hi)||1;
  const lines=[]; for(const [v,l] of [[t.lo,'LSL'],[t.hi,'USL']]) if(v===v&&v>=lo-span*3&&v<=hi+span*3){lines.push([v,l]);lo=Math.min(lo,v);hi=Math.max(hi,v)}
  const pad=(hi-lo)*.08||1; lo-=pad;hi+=pad;
  const W=Math.max(520,st.length*70+90),H=280,L=62,R=14,T=14,B=34, pw=(W-L-R)/st.length;
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${name} 各 site box plot">`;
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  for(const [v,l] of lines) s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bad)" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(v)-3}" text-anchor="end" style="fill:var(--bad)">${l} ${fmt(v)}</text>`;
  const gm=r.st.map(x=>x.med).reduce((a,b)=>a+b,0)/st.length;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(gm)}" y2="${y(gm)}" stroke="var(--acc)" stroke-dasharray="2 3"/>`;
  st.forEach((o,i)=>{const cx=L+pw*(i+.5),bw=Math.min(34,pw*.55),bad=o.site===r.worst;
    s+=`<line x1="${cx}" x2="${cx}" y1="${y(o.wl)}" y2="${y(o.wh)}" stroke="var(--mute)"/><rect x="${cx-bw/2}" y="${y(o.q3)}" width="${bw}" height="${Math.max(1,y(o.q1)-y(o.q3))}" fill="${bad?'var(--bad)':'var(--box)'}" fill-opacity="${bad?.55:.8}" stroke="var(--mute)"/><line x1="${cx-bw/2}" x2="${cx+bw/2}" y1="${y(o.med)}" y2="${y(o.med)}" stroke="var(--ink)" stroke-width="2"/><text x="${cx}" y="${H-16}" text-anchor="middle">Site ${o.site}</text><text x="${cx}" y="${H-3}" text-anchor="middle">n=${o.n}</text>`});
  s+='</svg>';
  const tab=`<div class="tw"><table><thead><tr><th>Site</th><th>N</th><th>中位數</th><th>平均</th><th>σ</th><th>與全 site 中位數均值差</th><th>超出 spec 顆數</th></tr></thead><tbody>${st.map(o=>`<tr><td>Site ${o.site}</td><td>${o.n}</td><td>${fmt(o.med)}</td><td>${fmt(o.mean)}</td><td>${fmt(o.sd)}</td><td>${(o.med-gm>0?'+':'')+fmt(o.med-gm)}</td><td>${o.f}</td></tr>`).join('')}</tbody></table></div>`;
  $('detail').hidden=false;
  $('detail').innerHTML=`<h2>${name}${t.unit?' ('+t.unit+')':''}</h2>${s}<p class="note">方塊 = Q1~Q3，黑線 = 中位數，鬚 = 1.5 IQR 內最遠值，藍虛線 = 各 site 中位數均值，橘色方塊 = 偏離最大的 site。</p>${tab}`;
}

/* ---------- events ---------- */
const drop=$('drop');
drop.onclick=()=>$('file').click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
$('file').onchange=e=>load([...e.target.files]);
['dragover','dragenter'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>load([...e.dataTransfer.files]));
['lot','b1'].forEach(i=>$(i).onchange=analyze);
['t1','t2','only'].forEach(i=>$(i).oninput=render);
$('tb').tHead.addEventListener('click',e=>{const k=e.target.closest('th')?.dataset.k;if(!k)return;sortDir=sortKey===k?-sortDir:-1;sortKey=k;render()});
$('tb').tBodies[0].addEventListener('click',e=>{const tr=e.target.closest('tr');if(!tr||!tr.dataset.n)return;selTest=tr.dataset.n;render();$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})});
</script>
</body>
</html>
